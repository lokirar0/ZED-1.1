name: Build ZED

# НА ВРЕМЯ ЗАЛИВКИ ФАЙЛОВ: сборка только вручную и по тегам v*.
# Когда всё готово — верни push/pull_request триггеры (блок в конце файла).
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 (требуется AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle без wrapper-файлов (кэш включён автоматически)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Keystore из секрета: секрет ТОЛЬКО через env, условие проверяет shell
      #    (secrets внутри if: запрещён политикой GitHub — это ломало сборку раньше)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Keystore decoded to app/release.keystore"
          else
            echo "No KEYSTORE_BASE64 secret: release will fall back to debug signing"
          fi

      # 5. Debug APK
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # 6. Release APK — только при создании тега v*
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # 7. Артефакт: debug APK (хранится 7 дней)
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZED-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 8. GitHub Release с APK — только для тегов
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
